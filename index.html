<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALT BURGUER · Entrar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { charcoal: '#1c1c1c', panel: '#262626', off: '#f5f2ea', brand: '#ff6a13' } } } }</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-charcoal text-off min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-sm">
  <h1 class="text-4xl font-extrabold tracking-tight">ALT <span class="text-brand">BURGUER</span></h1>
  <p class="text-off/60 mt-1 mb-6">Gestão interna</p>
  <form id="f" class="card space-y-3">
    <label>E-mail<input id="email" type="email" required autocomplete="username" class="input"></label>
    <label>Senha<input id="senha" type="password" required autocomplete="current-password" class="input"></label>
    <p id="erro" role="alert" class="text-red-400 text-sm min-h-[1.25rem]"></p>
    <button id="go" class="btn w-full">Entrar</button>
    <button type="button" id="esqueci" class="text-sm underline text-off/70 w-full">Esqueci minha senha</button>
  </form>
</main>

<script type="module">
import { entrar, observarSessao, recuperarSenha, traduzErro } from "./js/auth.js";
const $ = (id) => document.getElementById(id);

observarSessao((p) => { if (p) location.replace("app.html"); });

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("erro").textContent = "";
  $("go").disabled = true;
  try {
    await entrar($("email").value.trim(), $("senha").value);
    location.replace("app.html");
  } catch (err) {
    $("erro").textContent = traduzErro(err);
  } finally {
    $("go").disabled = false;
  }
});

$("esqueci").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { $("erro").textContent = "Digite seu e-mail acima e clique de novo."; return; }
  try {
    await recuperarSenha(email);
    $("erro").textContent = "Se o e-mail existir, enviamos um link para criar nova senha.";
  } catch (err) {
    $("erro").textContent = traduzErro(err);
  }
});
</script>
</body>
</html>
