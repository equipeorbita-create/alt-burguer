<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALT BURGUER · Gestão</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { charcoal: '#1c1c1c', panel: '#262626', off: '#f5f2ea', brand: '#ff6a13' } } } }</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-charcoal text-off min-h-screen">
<aside id="lateral" class="fixed inset-y-0 left-0 w-60 bg-black/50 border-r border-white/10 p-4 z-30 -translate-x-full md:translate-x-0 transition-transform flex flex-col">
  <h1 class="text-2xl font-extrabold tracking-tight mb-4 px-2">ALT <span class="text-brand">BURGUER</span></h1>
  <nav id="menu" class="flex-1"></nav>
  <div class="border-t border-white/10 pt-3 px-2">
    <div id="quem" class="mb-2"></div>
    <button id="sair" class="btn-alt">Sair</button>
  </div>
</aside>

<div class="md:ml-60">
  <header class="flex items-center gap-3 p-4 border-b border-white/10">
    <button id="abrir" class="btn-alt md:hidden" aria-label="Abrir menu">Menu</button>
    <h2 id="titulo" class="text-2xl font-extrabold"></h2>
  </header>
  <main id="conteudo" class="p-4 md:p-6 max-w-6xl"></main>
</div>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-off text-charcoal px-5 py-2 rounded-full font-semibold z-50"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
