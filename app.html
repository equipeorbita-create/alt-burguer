<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>ALT BURGUER · Gestão</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272928">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { ink: '#272928', paper: '#F4F1E6', brand: { DEFAULT: '#EA681D', dark: '#B8470B' } } } } }</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <svg class="logo " viewBox="0 0 200 146" role="img" aria-label="ALT BURGUER" fill="currentColor" font-family="Anton, Impact, 'Arial Narrow', sans-serif">
  <text x="0" y="84" font-size="104" textLength="200" lengthAdjust="spacingAndGlyphs">ALT</text>
  <text x="0" y="140" font-size="58" textLength="200" lengthAdjust="spacingAndGlyphs">BURGUER</text>
</svg>
  <button id="abrir" class="avatar" aria-label="Abrir menu"><span id="inicial">A</span></button>
</header>

<aside id="lateral" aria-label="Menu principal">
  <svg class="logo marca" viewBox="0 0 200 146" role="img" aria-label="ALT BURGUER" fill="currentColor" font-family="Anton, Impact, 'Arial Narrow', sans-serif">
  <text x="0" y="84" font-size="104" textLength="200" lengthAdjust="spacingAndGlyphs">ALT</text>
  <text x="0" y="140" font-size="58" textLength="200" lengthAdjust="spacingAndGlyphs">BURGUER</text>
</svg>
  <nav id="menu"></nav>
  <div id="quem"></div>
  <button id="sair" type="button">Sair</button>
</aside>
<div id="scrim"></div>

<div class="shell">
  <div class="wrap">
    <h2 id="titulo"></h2>
    <main id="conteudo"></main>
  </div>
</div>

<nav id="bottom" aria-label="Navegação rápida"></nav>
<div id="toast" class="hidden" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
